title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: "Please check README.md and docs/START_HERE.md first. Do not post private recordings, model weights or secrets."
  - type: textarea
    id: question
    attributes:
      label: What would you like help with?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Opera version and platform
    validations:
      required: true
